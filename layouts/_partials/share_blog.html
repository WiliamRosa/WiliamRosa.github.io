{{- $url := site.BaseURL | absURL | strings.TrimSuffix "/" }}
{{- $title := site.Title }}
{{- $caption := printf "Artigos e opiniões sobre Databricks, Azure e IA no blog do %s: %s" site.Params.author $url }}
<div class="share-blog">
    <p class="share-blog-text">Se gostou, ajude a comunidade compartilhando este blog</p>
    <div class="share-blog-buttons">
        <button type="button" class="share-blog-btn share-blog-btn--linkedin" data-share-url="{{ $url }}"
            data-share-caption="{{ $caption }}" aria-label="Compartilhar este blog no LinkedIn">
            {{ partial "svg.html" (dict "name" "linkedin") }}
            <span class="share-blog-linkedin-label">Compartilhar</span>
        </button>
        <button type="button" class="share-blog-btn share-blog-btn--copy" data-share-url="{{ $url }}"
            aria-label="Copiar link do blog">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
            <span class="share-blog-copy-label">Copiar link</span>
        </button>
    </div>
</div>
<script>
    (function () {
        function copyText(text, onDone) {
            function fallbackCopy() {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                var ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (e) {
                    ok = false;
                }
                document.body.removeChild(ta);
                onDone(ok);
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(function () {
                    onDone(true);
                }, fallbackCopy);
            } else {
                fallbackCopy();
            }
        }

        function withFeedback(btn, label, messages) {
            var original = label.textContent;
            var resetTimer;
            return function (ok) {
                clearTimeout(resetTimer);
                label.textContent = ok ? messages.ok : messages.fail;
                btn.classList.toggle('share-blog-btn--copied', ok);
                resetTimer = setTimeout(function () {
                    label.textContent = original;
                    btn.classList.remove('share-blog-btn--copied');
                }, 2500);
            };
        }

        var copyBtn = document.querySelector('.share-blog-btn--copy');
        if (copyBtn) {
            var copyLabel = copyBtn.querySelector('.share-blog-copy-label');
            var reportCopy = withFeedback(copyBtn, copyLabel, { ok: 'Link copiado!', fail: 'Não foi possível copiar' });
            copyBtn.addEventListener('click', function () {
                copyText(copyBtn.getAttribute('data-share-url'), reportCopy);
            });
        }

        var linkedinBtn = document.querySelector('.share-blog-btn--linkedin');
        if (linkedinBtn) {
            var linkedinLabel = linkedinBtn.querySelector('.share-blog-linkedin-label');
            var reportLinkedin = withFeedback(linkedinBtn, linkedinLabel, { ok: 'Texto copiado, cole no post!', fail: 'Abrindo LinkedIn…' });
            linkedinBtn.addEventListener('click', function () {
                var url = linkedinBtn.getAttribute('data-share-url');
                var caption = linkedinBtn.getAttribute('data-share-caption');
                copyText(caption, reportLinkedin);
                window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(url), '_blank', 'noopener,noreferrer');
            });
        }
    })();
</script>

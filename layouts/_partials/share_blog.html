{{- $url := site.BaseURL | absURL }}
{{- $title := site.Title }}
<div class="share-blog">
    <p class="share-blog-text">Se gostou, ajude a comunidade compartilhando este blog</p>
    <div class="share-blog-buttons">
        <a class="share-blog-btn share-blog-btn--linkedin" target="_blank" rel="noopener noreferrer"
            aria-label="Compartilhar este blog no LinkedIn"
            href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url }}">
            {{ partial "svg.html" (dict "name" "linkedin") }}
            <span>Compartilhar</span>
        </a>
        <button type="button" class="share-blog-btn share-blog-btn--copy" data-share-url="{{ $url }}"
            aria-label="Copiar link do blog">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg>
            <span class="share-blog-copy-label">Copiar link</span>
        </button>
    </div>
</div>
<script>
    (function () {
        var btn = document.querySelector('.share-blog-btn--copy');
        if (!btn) return;
        var url = btn.getAttribute('data-share-url');
        var label = btn.querySelector('.share-blog-copy-label');
        var original = label.textContent;
        var resetTimer;

        function showFeedback(ok) {
            clearTimeout(resetTimer);
            label.textContent = ok ? 'Link copiado!' : 'Não foi possível copiar';
            btn.classList.toggle('share-blog-btn--copied', ok);
            resetTimer = setTimeout(function () {
                label.textContent = original;
                btn.classList.remove('share-blog-btn--copied');
            }, 2000);
        }

        function fallbackCopy() {
            var ta = document.createElement('textarea');
            ta.value = url;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            var ok = false;
            try {
                ok = document.execCommand('copy');
            } catch (e) {
                ok = false;
            }
            document.body.removeChild(ta);
            showFeedback(ok);
        }

        btn.addEventListener('click', function () {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(function () {
                    showFeedback(true);
                }, fallbackCopy);
            } else {
                fallbackCopy();
            }
        });
    })();
</script>

baseURL: "https://WiliamRosa.github.io/"
locale: pt-br
title: "Wiliam Rosa | Lakehouse, Dados & IA"
theme: PaperMod
paginate: 20

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Wiliam Rosa | Lakehouse, Dados & IA"
  description: "Arquitetura e Engenharia de Dados, Governança, Analytics e IA com Databricks, Azure, AWS e Microsoft Fabric"
  images: ["images/wiliam-rosa-og.png"]
  keywords: [Databricks, Azure, AWS, Microsoft Fabric, Data Engineering, Data Architecture, Governance, Analytics, Machine Learning, Lakehouse]
  author: "Wiliam Rosa"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowShareButtons: true
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"

  label:
    text: "Home"
    icon: /favicon.ico
    iconHeight: 35

  # editar com seus dados reais depois
  homeInfoParams:
    Title: "Olá, eu sou Wiliam Rosa 👋"
    Content: >
      Data Solution Architect com mais de 20 anos de experiência em
      Engenharia de Dados, hoje atuando na **GFT Technologies** com
      plataformas modernas de dados, governança, analytics e Inteligência
      Artificial usando Databricks, Azure, AWS e Microsoft Fabric. **9x
      Certificado Microsoft** — incluindo Azure Databricks Data Engineer
      Associate e Azure Database Administrator Associate —, Databricks
      Certified Machine Learning Professional, Microsoft Certified Trainer
      (MCT) e líder do **São Paulo Databricks User Group**. Palestrante e
      coordenador de trilhas de Dados e IA no **TDC (The Developers
      Conference)**, e autor dos livros *Lakehouse Engineering com
      Databricks* e *Machine Learning Prático com Python*. Meu objetivo é
      contribuir cada vez mais com a comunidade Microsoft e Databricks,
      compartilhando
      aqui artigos técnicos e opiniões sobre esse universo.

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/wiliam-rosa/"
    - name: github
      url: "https://github.com/WiliamRosa"
    - name: rss
      url: "index.xml"

  editPost:
    URL: "https://github.com/WiliamRosa/WiliamRosa.github.io/tree/main/content"
    Text: "Sugerir edição"
    appendFilePath: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: search
      name: Buscar
      url: /search/
      weight: 10
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 20
    - identifier: events
      name: Eventos
      url: /events/
      weight: 25
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: about
      name: Sobre
      url: /about/
      weight: 40

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
